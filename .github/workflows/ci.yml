name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps
        # OpenCV headless still needs libGL at import time on Linux.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install project
        # Heavy optional deps (ultralytics/torch) are not needed for the unit
        # suite; tests mock the model layer.
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install fastapi uvicorn pydantic requests python-dotenv \
            opencv-python-headless numpy moviepy proglog pillow \
            webvtt-py google-auth google-auth-oauthlib google-auth-httplib2 \
            google-api-python-client yt-dlp

      - name: Ruff (bug-level rules)
        run: ruff check backend

      - name: Compile check
        run: python -m compileall -q backend

      - name: Unit tests
        run: python -m unittest discover -s backend -p "test_*.py" -v

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build
