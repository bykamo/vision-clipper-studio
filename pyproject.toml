[project]
name = "vision-clipper"
version = "1.0.0"
description = "AI Viral Video Clipper Studio"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".venv",
  "build",
  "dist",
  "temp",
  "clips",
  "downloads",
  "vision_clipper.egg-info",
]

[tool.ruff.lint]
# Start from the rules that catch real defects. Stylistic families (isort,
# pyupgrade, SIM, RUF) are intentionally not enabled yet: the codebase predates
# them and enabling all at once would produce ~200 non-blocking findings.
select = [
  "F",    # pyflakes: undefined names, unused imports, duplicate keys
  "E9",   # syntax / runtime errors
  "B",    # flake8-bugbear: likely bugs (mutable defaults, bare except, ...)
]
ignore = [
  "B008",   # FastAPI Depends()/Query() in defaults is idiomatic
  "B011",   # assert False is used deliberately in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately poke at private helpers and use long fixture strings.
"backend/test_*.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
